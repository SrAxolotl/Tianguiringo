<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiangiringo - Contáctanos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/Productos.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* Caja oscura de fondo para asegurar contraste y legibilidad */
    .contenedor-formulario {
      background-color: rgba(18, 21, 27, 0.85); /* Fondo negro con ligera transparencia */
      border: 2px solid #2d3538;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .form-custom-label {
      color: #ffffff;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .form-custom-input {
      background-color: #191e1f;
      border: 2px solid #2d3538;
      color: #ffffff;
      border-radius: 8px;
      padding: 12px;
    }

    .form-custom-input:focus {
      background-color: #1e2426;
      border-color: #ffbb00;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 187, 0, 0.3);
    }

    .btn-enviar {
      background-color: #ffbb00;
      color: #12151b;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      border: none;
      padding: 14px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-enviar:hover {
      background-color: #e0a300;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="a1">

  <header class="navbar navbar-expand-md custom-header">
    <div class="container-fluid d-flex justify-content-between align-items-center px-4 py-2">
      <a href="index.html" class="logo navbar-brand m-0">
        <img src="Imagenes/Logo (2).png" alt="Logo">
      </a>
      
      <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#menuContacto" aria-controls="menuContacto" aria-expanded="false" aria-label="Toggle navigation" style="filter: invert(1);">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="menuContacto">
        <nav>
          <ul class="custom-menu navbar-nav m-0 p-0 d-flex list-unstyled">
            <li class="nav-item"><a href="Productos.html" class="nav-link">Inicio</a></li>
            <li class="nav-item"><a href="TdsLosProductos.html" class="nav-link">Productos</a></li>
            <li class="nav-item"><a href="Contacto.html" class="nav-link active">Contacto</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        
        <div class="contenedor-formulario">
          
          <h1 class="titulo text-center mb-4 fw-bold">CONTÁCTANOS</h1>
          
          <form id="formulario-contacto" onsubmit="enviarMensaje(event)">
            
            <div class="mb-4 d-flex flex-column">
              <label for="nombre" class="form-custom-label">Nombre Completo</label>
              <input type="text" id="nombre" class="form-control form-custom-input" placeholder="Introduce tu nombre" required>
            </div>

            <div class="mb-4 d-flex flex-column">
              <label for="correo" class="form-custom-label">Correo Electrónico</label>
              <input type="email" id="correo" class="form-control form-custom-input" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="mb-4 d-flex flex-column">
              <label for="mensaje" class="form-custom-label">Mensaje o Sugerencia</label>
              <textarea id="mensaje" class="form-control form-custom-input" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>
