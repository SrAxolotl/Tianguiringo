<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax ejercicio</title>
    <link href="imagenes/Favicon.png" rel="icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            background-color: #191e1f;
            font-family: "Chakra Petch", sans-serif;
        }
 
        #parallax-container {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }
 
        /* FONDO - Ocupa toda la pantalla de forma fija */
        #layer1 {
            position: absolute;
            z-index: 1;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("Imagenes/DMC_04.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
 
        /* CONTENEDOR DEL LOGO */
        #layer3 {
            position: absolute;
            z-index: 3;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Reemplazamos el flexbox manual por clases de Bootstrap en el HTML */
        }

        /* Ajustamos el tamaño del logo de forma responsiva con utilidades de Bootstrap en el HTML */
        #layer3 img {
            height: auto;
        }

        /*  ESTILOS PERSONALIZADOS DEL BOTÓN (Mezclado con transiciones de Bootstrap) */
        .btn-inicio {
            background-color: #1e2a33;
            color: aliceblue;
            border-radius: 25px; /* Mantenemos tus esquinas muy redondeadas */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .btn-inicio:hover {
            background-color: #434b52;
            color: aliceblue;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .btn-inicio:active {
            transform: translateY(0);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
 
<body>
 
    <div id="parallax-container">
        <div id="layer1"></div>
 
        <!-- Usamos d-flex, justify-content-center y align-items-center de Bootstrap para centrar el logo -->
        <div id="layer3" class="d-flex justify-content-center align-items-center">
            <!-- 
              Usamos las clases responsivas de Bootstrap:
              w-55 en pantallas muy chicas, w-45 en tablets (md), y w-30 en pantallas grandes (lg)
            -->
            <img src="Imagenes/Logo (2).png" class="img-fluid w-55 w-md-45 w-lg-30" alt="Logo Tiangiringo">
        </div>
    </div>
 
    <!-- 
      Sección de contenido usando utilidades de Bootstrap:
      text-light (texto claro), text-center (centrado), py-5 (padding vertical) 
    -->
    <section class="contenido text-light text-center py-5 container-fluid" style="background-color: #191e1f; min-height: 500px;">
        <div class="container py-4">
            <h1 class="display-4 fw-bold mb-2">Tianguiringo</h1>
            <h2 class="h4 text-muted mb-4">tienda digital UACJ</h2>
            <p class="lead mb-5">Por una vida científica, por una ciencia vital</p>
            
            <!-- Botón estilizado combinando tus efectos con padding (px-5, py-3) y fuentes de Bootstrap -->
            <button class="btn btn-inicio px-5 py-3 fw-bold fs-5" onclick="window.location.href='Productos.html'">
                Inicio
            </button>
        </div>
    </section>
 
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const layer1 = document.getElementById('layer1');
            const layer3 = document.getElementById('layer3');
            const container = document.getElementById('parallax-container');
 
            const speed1 = 0.1;
            const speed3 = 0.5;
 
            function updateParallax() {
                const scrollOffset = container.getBoundingClientRect().top;
 
                // Movimiento del fondo
                layer1.style.transform = `translate3d(0, ${scrollOffset * speed1}px, 0)`;
                // Movimiento del logo
                layer3.style.transform = `translate3d(0, ${scrollOffset * speed3}px, 0)`;
            }
 
            window.addEventListener('scroll', updateParallax);
            updateParallax();
        });
    </script>
 
</body>
</html>
