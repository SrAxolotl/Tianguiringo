    /* Estilo para que todo el cuadro sea clickeable de forma limpia */
    .cuadro-link {

    }

      padding: 10px 20px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-categoria:hover, .btn-categoria.active {
      background-color: #ffbb00;
      border-color: #ffbb00;
      color: #12151b;
    }

  <script>
    // CAMBIO: Ahora la función recibe y guarda los 4 datos (nombre, imagen, precio, descripcion)
    function verDetalle(nombre, imagen, precio, descripcion) {
      localStorage.setItem('producto_nombre', nombre);
      localStorage.setItem('producto_imagen', imagen);
      localStorage.setItem('producto_precio', precio);
      localStorage.setItem('producto_descripcion', descripcion);
    }

    function toggleChat() {
      window.location.href = "Contacto.html";
    }

    // SISTEMA DE FILTRADO CON CLASES DE BOOTSTRAP
    function filtrarCategoria(categoria, botonSeleccionado) {
      const botones = document.querySelectorAll('.btn-categoria');
      botones.forEach(btn => btn.classList.remove('active'));
      botonSeleccionado.classList.add('active');

      const productos = document.querySelectorAll('.col-producto');
      productos.forEach(producto => {
        const catProducto = producto.getAttribute('data-categoria');
        
        if (categoria === 'todos' || catProducto === categoria) {
          producto.classList.remove('d-none');
        } else {
          producto.classList.add('d-none');
        }
      });
    }
  </script>
